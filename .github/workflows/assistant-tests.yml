name: Lightweight assistant tests

on:
  pull_request:
    paths: ["core/**", "cogs/**", "stats/**", "tests/**", "scripts/**", "docs/**", "bot.py", "requirements.txt", ".github/workflows/assistant-*.yml"]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: boton-offline-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

# Validation only. Enable Wait for CI in Railway's GitHub integration to gate
# automatic deployment; this workflow never uses provider/deployment secrets.

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install runtime and test dependencies
        run: python -m pip install -r requirements.txt pytest pytest-subtests
      - name: Run offline test suite
        run: python -m pytest -q tests
      - name: Replay synthetic conversations (not a live-model evaluation)
        run: python -m scripts.eval_boton
