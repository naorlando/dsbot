name: Lightweight assistant tests

on:
  pull_request:
    paths: ["core/assistant*.py", "core/updates.py", "cogs/assistant.py", "cogs/utility.py", "tests/test_assistant*.py", "scripts/test_assistant_live.py", "scripts/deploy/configure_assistant.py", "docs/COMANDOS.md", "docs/UPDATES.md", "bot.py", "requirements.txt", ".github/workflows/assistant-*.yml"]
  push:
    branches: [main]
    paths: ["core/assistant*.py", "core/updates.py", "cogs/assistant.py", "cogs/utility.py", "tests/test_assistant*.py", "scripts/test_assistant_live.py", "scripts/deploy/configure_assistant.py", "docs/COMANDOS.md", "docs/UPDATES.md", "bot.py", "requirements.txt", ".github/workflows/assistant-*.yml"]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python -m unittest discover -s tests -p 'test_assistant*.py'
      - run: python -m compileall -q core/assistant.py core/assistant_memory.py cogs/assistant.py bot.py scripts/test_assistant_live.py scripts/deploy/configure_assistant.py
