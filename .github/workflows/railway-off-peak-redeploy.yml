name: Railway off-peak deploy if changed

on:
  schedule:
    # Railway Free blocks deploys in this region from 08:00 to 20:00 ET.
    # Run shortly after the window closes and let GitHub handle DST.
    - cron: "23 20 * * *"
      timezone: "America/New_York"
  workflow_dispatch:
    inputs:
      check_only:
        description: "Inspect Railway without creating a deployment"
        type: boolean
        default: true
  push:
    branches: [main]
    paths:
      - .github/workflows/railway-off-peak-redeploy.yml
      - scripts/deploy/railway_if_changed.py
      - tests/test_railway_if_changed.py

permissions:
  contents: read

concurrency:
  group: railway-off-peak-redeploy
  cancel-in-progress: false

jobs:
  redeploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Test deployment decisions
        run: python -m unittest discover -s tests -p test_railway_if_changed.py
      - name: Compare main with Railway and deploy only if needed
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
          GH_TOKEN: ${{ github.token }}
          RAILWAY_SERVICE_ID: 90c60cd3-9b09-48c4-81b0-bd5fb5297033
          RAILWAY_ENVIRONMENT_ID: f80a184d-71dc-4b3a-9a79-b3760d7e4176
          CHECK_ONLY: ${{ github.event_name == 'push' || inputs.check_only }}
        run: python scripts/deploy/railway_if_changed.py
